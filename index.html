<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo-List</title>
    <link rel="stylesheet" href="./links/bootstrap.min.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="container bg-warning my-5 py-2">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="card shadow border">
            <div class="card-header">
              <h2 class="text-center bg-dark text-light">My Todo list</h2>
            </div>
            <div class="card-body">
              <form id="todoForm"  class="d-flex justify-content-between">
                <input
                  id="taskInput"
                  type="text"
                  class="form-control"
                  placeholder="Add tasks..."
                  
                />
                <button type="submit" class="btn btn-primary btn-sm" id="taskBtn">
                  AddTask
                </button>
              </form>
              <p id="hiddenText" class="text-center text-danger  mt-3" >No tasks added yet</p>
              <ul id="taskList" class="list-group mt-3"></ul>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./links/bootstrap.bundle.min.js"></script>
    <script src="./js/script.js"></script>
  </body>
</html>
